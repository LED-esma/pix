name: Pix
options:
  bundleIdPrefix: com.ramonledesma
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
    DEAD_CODE_STRIPPING: YES
    ARCHS: "arm64 x86_64"   # one app for Apple silicon and Intel Macs
    ONLY_ACTIVE_ARCH: NO
    DEVELOPMENT_TEAM: 7MX978TCBY

targets:
  # Floating pixel buddy. Runs Claude Code headless underneath. Signed with Developer ID
  # so Screen Recording and Accessibility permissions survive rebuilds.
  Pix:
    type: application
    platform: macOS
    sources:
      - path: Sources/Pix
      # Canvas plugin libraries, kept as a folder so paths survive (fetch with tools/fetch-plugins.sh).
      - path: Plugins
        type: folder
        buildPhase: resources
    info:
      path: Sources/Pix/Info.plist
      properties:
        CFBundleName: Pix
        CFBundleDisplayName: Pix
        CFBundleIconFile: Pix
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        NSRemindersFullAccessUsageDescription: Pix reads your reminders and adds the ones you ask for.
        NSRemindersUsageDescription: Pix reads your reminders and adds the ones you ask for.
        NSCalendarsFullAccessUsageDescription: Pix reads your calendar and adds the events you ask for.
        NSCalendarsUsageDescription: Pix reads your calendar and adds the events you ask for.
        NSAppleEventsUsageDescription: Pix uses Notes and Music when you ask it to.
        NSMicrophoneUsageDescription: Pix hears you while you hold its shortcut.
        PixUpdateRepo: "LED-esma/pix"
        NSSpeechRecognitionUsageDescription: Pix turns what you say into a question, on this Mac when it can.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ramonledesma.pix
        PRODUCT_NAME: Pix
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_ENTITLEMENTS: Sources/Pix/Pix.entitlements
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO  # no debugging entitlement (get-task-allow): Apple won't notarize it
        OTHER_LDFLAGS: "-weak_framework FoundationModels"  # the built-in model is macOS 26+; Pix still opens on 15
